{{define "components/endpoint-card/header"}}
<a
  class='{{ toKebab "endpoint" "card" "header" }} {{ toKebab "endpoint" "card" "header" .Op.Verb }}'
  id='{{ toKebab "header" .Name .Op.Verb}}'
>
  <div class="request-main-info">
    <p
      class='{{ toKebab "request" "type" "block" }} {{ toKebab "request" "type" "block" .Op.Verb }}'
    >
      {{.Op.Verb}}
    </p>
    <p>{{.Name}}</p>
  </div>
  <p class="header-description">{{.Op.Description}}</p>
  <svg class="header-arrow" width="20" height="10" viewBox="0 0 20 9">
    <polyline
      points="1,2 9.5,8 19,2"
      fill="none"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </svg>
</a>

<script>
  document.getElementById('{{ toKebab "header" .Name .Op.Verb}}').onclick = (
    event,
  ) => {
    event.preventDefault();
    const id = "{{toKebab .Name .Op.Verb}}";
    if (window.location.hash === "#" + id) {
      location.href = "#";
    } else {
      location.href = "#" + id;
    }
  };
</script>
{{end}}
