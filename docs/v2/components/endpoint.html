{{define "components/endpoint"}}
<script type="text/javascript">
  // This manages folding and expanding of the endpoint headers
  const onHashUpdate = ({ oldURL }) => {
    const hashIndex = oldURL?.lastIndexOf("#") ?? -1;
    const oldHash =
      hashIndex !== -1 && oldURL?.length > hashIndex
        ? oldURL.substring(hashIndex + 1)
        : "";
    const newHash =
      window.location.hash.length > 1 ? window.location.hash.substring(1) : "";

    const oldBodyId = "body-" + oldHash;
    const newBodyId = "body-" + newHash;

    const oldHeaderId = "header-" + oldHash;
    const newHeaderId = "header-" + newHash;

    const oldEndpoint = document.getElementById(oldBodyId);
    if (oldEndpoint) {
      oldEndpoint.style.display = "none";
    }

    const oldHeader = document.getElementById(oldHeaderId);
    if (oldHeader) {
      oldHeader.classList.remove("selected-header");
    }

    const newEndpoint = document.getElementById(newBodyId);
    if (newEndpoint) {
      newEndpoint.style.display = "flex";
    }

    const newHeader = document.getElementById(newHeaderId);
    if (newHeader) {
      newHeader.classList.add("selected-header");
    }

    const endpointCard = document.getElementById("card-" + newHash);
    endpointCard?.scrollIntoView();
  };

  window.addEventListener("hashchange", onHashUpdate);
  window.onload = () => onHashUpdate({ oldURL: "" });
</script>

{{range .Paths}} {{template "components/endpoint-card/endpoint-card" .}} {{end}}

<script>
  // Scroll example inputs to right end,
  // so we can see more of the important part of the url.
  const elements = document.getElementsByClassName("input-example");
  for (const el of elements) {
    el.scrollLeft = el.scrollWidth;
  }
</script>
{{end}}
